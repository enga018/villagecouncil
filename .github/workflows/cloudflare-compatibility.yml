name: Cloudflare compatibility check

on:
  push:
    branches:
      - cloudflare-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-compatibility
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check vinext compatibility
        run: npx --yes vinext check
